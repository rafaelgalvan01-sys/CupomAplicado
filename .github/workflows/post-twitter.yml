name: Postar cupom no Twitter/X

on:
  # Agendamento PAUSADO (ago/2026): o plano gratuito do X recusa postar com
  # "402 credits depleted" — postar pela API exige plano pago/creditos. Enquanto
  # isso nao for resolvido, deixamos so o disparo manual pra nao gerar e-mail de
  # falha de 6 em 6 horas. Pra religar o automatico, descomente o bloco abaixo.
  # schedule:
  #   # 4x/dia, a cada 6 horas (horário em UTC — Brasília é UTC-3).
  #   # 1 post por execução = ~120 posts/mês.
  #   - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Postar cupom no X
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/post-twitter.mjs
